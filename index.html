else if(a=='delwall'){const w=walls.find(x=>x.id==id);if(!w||!(isAdmin()||(me&&w.byE==me.email)))return;if(w.aid&&AS)AS.delete(w.aid).catch(()=>{});walls=walls.filter(x=>x.id!=id);sv('walls',walls);if(wpimg==w.url)setWp('cielo','');render()}
else if(a=='rmavp'){const p=profiles.find(x=>x.name==id);if(p){delete p.avatar;sv('profiles',profiles);render()}}
else if(a=='repgame'){const g=games.find(x=>x.id==id);if(g){g.rep=(g.rep||0)+1;sv('games',games);toast('⚑ '+t('ok'))}}
else if(a=='clrrep'){const g=games.find(x=>x.id==id);if(g){g.rep=0;sv('games',games);render()}}
else if(a=='upgameOld'){const f=document.getElementById('gf').files[0],ti=val('gt').trim();if(!f||!ti)return toast(t('title')+' + '+t('file'));if(bad(ti))return toast(t('blocked'));if(f.size>1.5e6)return toast('Máx 1.5 MB');const ext=f.name.split('.').pop().toLowerCase(),r=new FileReader();r.onload=()=>{const g={id:'g'+Date.now(),title:ti,by:me.name,rate:val('gr')};if(ext=='html'||ext=='htm')g.html=r.result;else{g.rom=f.name;g.sys=SYS[ext]||'ROM'}if(g.html&&bad(g.html.slice(0,5000)))return toast(t('blocked'));games.push(g);sv('games',games);S.tab='games';render()};if(ext=='html'||ext=='htm')r.readAsText(f);else r.readAsArrayBuffer(f.slice(0,16))}
else if(a=='saveav'){const f=document.getElementById('pf').files[0];if(!f||!f.type.startsWith('image/'))return toast('Imagen / Image');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);setAv(me.email,c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)}
else if(a=='rmav'){setAv(id,null)}
else if(a=='adminpw'){if(val('ap')=='EXA1234'){me.admin=true;sv('me',me);const u=users.find(x=>x.name==me.name);if(u){u.admin=true;sv('users',users);pub(u)}render()}else toast('Contraseña incorrecta')}
else if(a=='savecfg'){cfg.note=val('an');cfg.ban=val('bw').split(',').map(s=>s.trim()).filter(Boolean);sv('cfg',cfg);toast(t('ok'))}
else if(a=='signup'||a=='login'){const em=val('em').trim().toLowerCase(),pw=val('pw');
if(!em||!pw)return;const h=await hash(pw);if(a=='signup'){const n=val('un').trim();if(!n||!/^\S+@\S+\.\S+$/.test(em)||pw.length<6)return toast('Nombre, correo válido y contraseña ≥ 6');if(bad(n))return toast(t('blocked'));if(users.some(u=>u.email==em))return toast('Correo ya registrado');const u={name:n,email:em,h,country:val('co')};users.push(u);sv('users',users);me={...u};delete me.h}else{const u=users.find(u=>u.email==em&&u.h==h);if(!u)return toast('Datos incorrectos');me={name:u.name,email:u.email,country:u.country}}sv('me',me);pub(users.find(x=>x.email==me.email));go('games')}});
document.getElementById('acct').onclick=()=>{if(me){me=null;sv('me',null);go('games')}else go('login')};
document.getElementById('lang').onchange=ev=>{S.lang=ev.target.value;sv('lang',S.lang);render();upd()};
document.getElementById('logo').onclick=()=>go('games');
// En línea: personas con la página abierta ahora mismo (room). Sin conexión = 0.
let nOn=0;const upd=()=>{document.getElementById('online').textContent=nOn+' '+t('online')};upd();
(async()=>{try{const r=await claude.use('room');if(!r)return;r.onPeers(c=>{nOn=c.peers.filter(p=>p.kind=='viewer').length;upd()});r.presence({here:true})}catch(x){}})();
render();
</script></body></html>
